<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none">
  <!-- Northform Studios — Primary Vertical Logo Lockup -->
  <g transform="translate(88, 20)">
    <!-- Continuous Folded Ribbon Monogram -->
    <path d="M14 25 L25 14 V50 H14 V25 Z" fill="#151A24" />
    <path d="M14 14 H25 L50 39 V50 H39 L14 25 Z" fill="#496BFF" />
    <path d="M39 14 H50 V39 L39 50 V14 Z" fill="#151A24" />
    <path d="M14 25 L25 14" stroke="#DCE5FF" stroke-width="1.25" stroke-linecap="round" />
    <path d="M39 50 L50 39" stroke="#DCE5FF" stroke-width="1.25" stroke-linecap="round" />
  </g>
  <!-- Primary Wordmark -->
  <text x="120" y="112" text-anchor="middle" font-family="'Manrope', -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.03em" fill="#151A24">NORTHFORM</text>
  <!-- Secondary Studio Label -->
  <text x="120" y="132" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="9" letter-spacing="0.28em" fill="#707887">STUDIOS</text>
  <!-- Official Tagline -->
  <text x="120" y="152" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="7.5" letter-spacing="0.2em" fill="#707887" opacity="0.8">BUILT WITH INTENT.</text>
</svg>
