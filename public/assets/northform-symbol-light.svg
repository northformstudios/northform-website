<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
<defs>
    <filter id="nf-depth-standalone" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>

    <linearGradient id="nf-base-standalone" x1="5%" y1="10%" x2="95%" y2="90%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="22%" stop-color="#94A3B8" />
      <stop offset="42%" stop-color="#3B82F6" />
      <stop offset="64%" stop-color="#1D4ED8" />
      <stop offset="82%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="nf-silver-standalone" x1="0%" y1="95%" x2="40%" y2="5%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#CBD5E1" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#F8FAFC" stop-opacity="1" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="nf-caustics-standalone" x1="28%" y1="25%" x2="92%" y2="88%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.85" />
      <stop offset="82%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="nf-crest-standalone" x1="5%" y1="35%" x2="52%" y2="5%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="nf-ridge-standalone" x1="30%" y1="20%" x2="72%" y2="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#93C5FD" stop-opacity="0.65" />
      <stop offset="85%" stop-color="#C084FC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="nf-fresnel-standalone" x1="75%" y1="92%" x2="98%" y2="2%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#BAE6FD" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <clipPath id="nf-body-clip-standalone">
      <path d="M12 152
         C 3 135, 1 85, 2 72
         C 3 26, 22 2, 54 2
         C 78 2, 100 16, 118 52
         C 130 76, 137 106, 146 136
         C 152 152, 166 154, 175 140
         C 188 122, 196 82, 198 48
         C 199 22, 197 4, 192 1
         C 184 4, 172 16, 161 30
         C 150 44, 146 68, 144 88
         C 137 100, 120 118, 98 120
         C 84 112, 77 86, 74 72
         C 68 70, 58 72, 54 78
         C 46 106, 38 135, 26 150
         C 22 155, 16 156, 12 152 Z" />
    </clipPath>
  </defs>

  <g filter="url(#nf-depth-standalone)">
    <!-- Base Body -->
    <path
      d="M12 152
         C 3 135, 1 85, 2 72
         C 3 26, 22 2, 54 2
         C 78 2, 100 16, 118 52
         C 130 76, 137 106, 146 136
         C 152 152, 166 154, 175 140
         C 188 122, 196 82, 198 48
         C 199 22, 197 4, 192 1
         C 184 4, 172 16, 161 30
         C 150 44, 146 68, 144 88
         C 137 100, 120 118, 98 120
         C 84 112, 77 86, 74 72
         C 68 70, 58 72, 54 78
         C 46 106, 38 135, 26 150
         C 22 155, 16 156, 12 152 Z"
      fill="url(#nf-base-standalone)"
    />

    <!-- Frosted Silver on Left Arch -->
    <path
      d="M12 152
         C 3 135, 1 85, 2 72
         C 3 26, 22 2, 54 2
         C 78 2, 100 16, 118 52
         C 106 66, 92 68, 74 72
         C 68 70, 58 72, 54 78
         C 46 106, 38 135, 26 150
         C 22 155, 16 156, 12 152 Z"
      fill="url(#nf-silver-standalone)"
    />

    <!-- Optical Caustics -->
    <path
      d="M74 72
         C 86 46, 104 28, 118 52
         C 130 76, 137 106, 146 136
         C 152 152, 166 154, 175 140
         C 188 122, 196 82, 198 48
         C 192 40, 182 56, 175 80
         C 165 108, 154 132, 144 124
         C 132 115, 118 92, 98 78
         C 86 70, 78 70, 74 72 Z"
      fill="url(#nf-caustics-standalone)"
      style="mix-blend-mode: screen;"
    />

    <!-- Inner Core Occlusion -->
    <g clip-path="url(#nf-body-clip-standalone)">
      <ellipse cx="120" cy="115" rx="28" ry="18" fill="#020617" opacity="0.65" style="filter: blur(8px);" />
    </g>

    <!-- Top Arch Specular Crest -->
    <path
      d="M16 60
         C 20 25, 34 6, 56 4
         C 75 4, 94 15, 108 34"
      stroke="url(#nf-crest-standalone)"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
      style="filter: drop-shadow(0 0 3px rgba(255,255,255,0.9));"
    />

    <!-- Diagonal Ridge Specular -->
    <path
      d="M58 42
         C 76 30, 96 34, 114 56
         C 126 74, 134 102, 142 128"
      stroke="url(#nf-ridge-standalone)"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
      style="filter: drop-shadow(0 0 2px rgba(255,255,255,0.7));"
    />

    <!-- Right Fin Fresnel Rim -->
    <path
      d="M166 148
         C 178 136, 192 98, 196 55
         C 198 28, 196 6, 192 1"
      stroke="url(#nf-fresnel-standalone)"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
      style="filter: drop-shadow(0 0 3px rgba(186, 230, 253, 0.95));"
    />

    <!-- Apex Point Highlight -->
    <circle cx="192" cy="2" r="2.2" fill="#FFFFFF" style="filter: drop-shadow(0 0 3px #FFFFFF);" />
  </g>
</svg>